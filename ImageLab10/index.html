<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img src="assets\SkyboxThing.png" id="SkyboxThing" alt="">
        <img src="assets\12_beach sand texture-seamless.jpg" id="beachSand" alt="">
        <img src="assets\Waffle Cone.jpg" id="WaffleCone" alt="">
      </a-assets>
      <a-box position="-1 0.5 -3" rotation="0 0 0" src="#beachSand"></a-box>
      <a-cylinder position="-1.5 1 -3.5" radius="0.1" height="2" src="#beachSand"></a-cylinder>
      <a-cylinder position="-0.5 1 -3.5" radius="0.1" height="2" src="#beachSand"></a-cylinder>
      <a-cylinder position="-1.5 1 -2.5" radius="0.1" height="2" src="#beachSand"></a-cylinder>
      <a-cylinder position="-0.5 1 -2.5" radius="0.1" height="2" src="#beachSand"></a-cylinder>

      <a-sphere position="1.5 2 -2" radius=".5" color="#FFFFFF"></a-sphere>
      <a-cone position="1.5 1.25 -2" radius-bottom="0.1" radius-top="0.5" height="1" src="#WaffleCone"></a-cone>
      
      <a-sky src="#SkyboxThing"></a-sky>
    </a-scene>
  </body>
</html>
